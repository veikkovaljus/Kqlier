# Publishes kqlier to NuGet using trusted publishing (OIDC) and attaches
# CHANGELOG.md to the GitHub release when a v* tag is pushed.
# Requires a NUGET_USER repository secret set to the nuget.org profile name.

name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  id-token: write
  contents: write

jobs:
  publish:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Pack
      run: dotnet pack Kqlier.csproj --configuration Release --no-restore
    - name: NuGet login (OIDC)
      id: login
      uses: NuGet/login@v1
      with:
        user: ${{ secrets.NUGET_USER }}
    - name: Push to NuGet
      run: dotnet nuget push "nupkg/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
    - name: Create GitHub release
      uses: softprops/action-gh-release@v2
      with:
        files: CHANGELOG.md
